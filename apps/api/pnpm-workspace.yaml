packages:
  - 'apps/*'

allowBuilds:
  '@nestjs/core': true
  '@prisma/engines': set this to true or false
  es5-ext: true
  fsevents: true
  prisma: set this to true or false

overrides:
  '@types/express': '4.17.1'
  '@types/express-serve-static-core': '4.17.1'
  '@types/superagent': '3.8.7'
  '@types/node': '12.7.5'
