packages:
  - 'apps/*'

allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  es5-ext: true
  fsevents: true
  msgpackr-extract: true
  prisma: true

overrides:
  '@types/express': '4.17.1'
  '@types/express-serve-static-core': '4.17.1'
  '@types/superagent': '3.8.7'
  '@types/node': '12.7.5'
