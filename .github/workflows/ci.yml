name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: instascope_db
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:alpine
        ports:
          - "6379:6379"
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/instascope_db?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test_jwt_secret_for_ci_only_not_for_production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: API Paketlerini Yükle, Migrate Et ve Test Et
        working-directory: apps/api
        run: |
          pnpm install --frozen-lockfile
          npx prisma migrate deploy --schema=./prisma/schema.prisma
          pnpm exec jest --config ./test/jest-e2e.json --runInBand --coverage --forceExit
      - name: Python bağımlılıklarını tarat (pip-audit)
        run: |
          pip install pip-audit
          pip-audit --format json --output pip-audit-report.json || true
      - name: Docker imajını build et
        run: docker build --no-cache -t my-app-image:latest -f apps/ai/Dockerfile apps/ai
      - name: Trivy ile imaj taraması yap
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'my-app-image:latest'
          format: 'json'
          output: 'trivy-report.json'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
      - name: Tarama raporlarını artifact olarak kaydet
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            pip-audit-report.json
            trivy-report.json
